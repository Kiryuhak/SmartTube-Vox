name: Release

on:
  push:
    tags:
      - 'v*-vot.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для сборки релиза (например: v32.45-vot.1)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine tag name and dynamic base version
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          # Tag format validation: vX.Y-vot.Z
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+)-vot\.([0-9]+)$ ]]; then
            echo "::error::Неверный формат тега: $TAG. Ожидается: v<версия>-vot.<номер>, например v32.45-vot.1"
            exit 1
          fi

          TAG_BASE_VER="${BASH_REMATCH[1]}"
          VOT_PATCH="${BASH_REMATCH[2]}"
          VERSION_NAME="${TAG_BASE_VER}-vot.${VOT_PATCH}"
          VOT_SUFFIX="-vot.${VOT_PATCH}"

          # Защитная проверка 1: votPatch строго в диапазоне 1..999
          if [ "$VOT_PATCH" -lt 1 ] || [ "$VOT_PATCH" -gt 999 ]; then
            echo "::error::votPatch должен быть строго в диапазоне 1..999! Получено: $VOT_PATCH"
            exit 1
          fi

          # Автоматическое считывание базовых versionName и versionCode из проекта
          BASE_CODE=$(grep -E '^\s*versionCode\s+[0-9]+' smarttubetv/build.gradle | awk '{print $2}' | head -n 1)
          PROJECT_BASE_VER=$(grep -E '^\s*versionName\s+"[0-9]+\.[0-9]+"' smarttubetv/build.gradle | sed -E 's/.*"([0-9]+\.[0-9]+)".*/\1/' | head -n 1)

          if [ -z "$BASE_CODE" ]; then
            echo "::error::Не удалось определить базовый versionCode из smarttubetv/build.gradle!"
            exit 1
          fi

          echo "Обнаружен базовый код проекта: $BASE_CODE, базовая версия: $PROJECT_BASE_VER"
          EXPECTED_CODE=$(( BASE_CODE * 1000 + VOT_PATCH ))

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VOT_SUFFIX=$VOT_SUFFIX" >> $GITHUB_OUTPUT
          echo "VOT_PATCH=$VOT_PATCH" >> $GITHUB_OUTPUT
          echo "EXPECTED_CODE=$EXPECTED_CODE" >> $GITHUB_OUTPUT
          echo "BASE_CODE=$BASE_CODE" >> $GITHUB_OUTPUT

          echo "Выбрана версия: $VERSION_NAME (versionCode: $EXPECTED_CODE, votPatch: $VOT_PATCH, baseCode: $BASE_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify monotonicity with previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_info.outputs.TAG }}
          EXPECTED_CODE: ${{ steps.tag_info.outputs.EXPECTED_CODE }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import sys, os, re, json, urllib.request, subprocess

          tag_name = os.environ['TAG_NAME']
          expected_code = int(os.environ['EXPECTED_CODE'])
          repo = os.environ['REPO']
          token = os.environ.get('GH_TOKEN', '')

          headers = {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'smarttube-vot-release-ci'
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          url = f'https://api.github.com/repos/{repo}/releases?per_page=100'
          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode('utf-8'))
          except Exception as e:
              print(f'Предупреждение при запросе списка релизов: {e}')
              releases = []

          if not isinstance(releases, list):
              releases = []

          vot_pattern = re.compile(r'^v([0-9]+\.[0-9]+)-vot\.([0-9]+)$')

          # Фильтруем только релизы SmartTube VOT, исключая текущий тег и черновики
          valid_prev_releases = [
              r for r in releases
              if r.get('tag_name') != tag_name
              and not r.get('draft', False)
              and vot_pattern.match(r.get('tag_name', ''))
          ]

          # Случай A: Предыдущих релизов SmartTube VOT нет (первый релиз)
          if not valid_prev_releases:
              print('Первый релиз SmartTube VOT: проверка предыдущего versionCode не требуется.')
              sys.exit(0)

          prev_release = valid_prev_releases[0]
          prev_tag = prev_release.get('tag_name', '')
          print(f'Найден предыдущий релиз SmartTube VOT: {prev_tag}')

          prev_code = None

          # Шаг 1: Поиск smarttube_vox.json или smarttube_vot.json в ассетах предыдущего релиза
          json_url = None
          for asset in prev_release.get('assets', []):
              if asset.get('name') in ('smarttube_vox.json', 'smarttube_vot.json'):
                  json_url = asset.get('browser_download_url')
                  break

          if json_url:
              try:
                  req_json = urllib.request.Request(json_url, headers=headers)
                  with urllib.request.urlopen(req_json) as jresp:
                      jdata = json.loads(jresp.read().decode('utf-8'))
                      for key, val in jdata.items():
                          if key != 'package' and isinstance(val, dict) and 'versionCode' in val:
                              prev_code = int(val['versionCode'])
                              print(f'Извлечён предыдущий versionCode из {asset.get("name")}: {prev_code}')
                              break
              except Exception as e:
                  print(f'Предупреждение при чтении файла обновления: {e}')

          # Шаг 2: Fallback к git-метаданным предыдущего тега с учётом его базовой версии
          if prev_code is None:
              m = vot_pattern.match(prev_tag)
              if m:
                  prev_patch = int(m.group(2))
                  try:
                      cmd = ['git', 'show', f'{prev_tag}:smarttubetv/build.gradle']
                      res = subprocess.run(cmd, capture_output=True, text=True, check=True)
                      code_match = re.search(r'versionCode\s+(\d+)', res.stdout)
                      if code_match:
                          prev_base_code = int(code_match.group(1))
                          prev_code = prev_base_code * 1000 + prev_patch
                          print(f'Определён baseVersionCode из git ({prev_tag}): {prev_base_code} -> предыдущий versionCode: {prev_code}')
                  except Exception as e:
                      print(f'Не удалось определить baseVersionCode из git для {prev_tag}: {e}')

          if prev_code is None:
              print(f'::error::Не удалось надёжно определить предыдущий versionCode из релиза ({prev_tag})! Остановка релиза в соответствии с политикой безопасности.', file=sys.stderr)
              sys.exit(1)

          print(f'Предыдущий versionCode: {prev_code}, ожидаемый текущий: {expected_code}')

          if expected_code <= prev_code:
              print(f'::error::Текущий versionCode ({expected_code}) должен быть строго больше предыдущего ({prev_code})! Релиз отклонён.', file=sys.stderr)
              sys.exit(1)

          print(f'Проверка строгой монотонности успешно пройдена ({expected_code} > {prev_code}).')
          "

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SMARTTUBE_VOT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMARTTUBE_VOT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTTUBE_VOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTTUBE_VOT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не найдены необходимые секреты для подписи релиза! Настройте: SMARTTUBE_VOT_KEYSTORE_BASE64, SMARTTUBE_VOT_STORE_PASSWORD, SMARTTUBE_VOT_KEY_ALIAS, SMARTTUBE_VOT_KEY_PASSWORD"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

          cat << EOF > keystore.properties
          storeFile=/tmp/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Конфигурация подписи создана на runner (без логирования секретов)."

      - name: Build signed stvot Release APK
        env:
          VERSION_NAME: ${{ steps.tag_info.outputs.VERSION_NAME }}
          VOT_SUFFIX: ${{ steps.tag_info.outputs.VOT_SUFFIX }}
          EXPECTED_CODE: ${{ steps.tag_info.outputs.EXPECTED_CODE }}
        run: |
          ./gradlew assembleStvotRelease \
            -PvotVersionName="$VERSION_NAME" \
            -PvotVersionSuffix="$VOT_SUFFIX" \
            -PvotVersionCode="$EXPECTED_CODE"

      - name: Verify APK authenticity and signature
        env:
          VERSION_NAME: ${{ steps.tag_info.outputs.VERSION_NAME }}
          EXPECTED_CODE: ${{ steps.tag_info.outputs.EXPECTED_CODE }}
        run: |
          OUTPUT_DIR="smarttubetv/build/outputs/apk/stvot/release"
          echo "Проверка файлов в $OUTPUT_DIR:"
          ls -la "$OUTPUT_DIR"

          UNIVERSAL_APK=$(find "$OUTPUT_DIR" -name "*vot*universal.apk" | head -n 1)
          if [ -z "$UNIVERSAL_APK" ] || [ ! -f "$UNIVERSAL_APK" ]; then
            echo "::error::Универсальный APK не найден в $OUTPUT_DIR!"
            exit 1
          fi
          echo "Найден универсальный APK: $UNIVERSAL_APK"

          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          # 1. Проверка package name
          echo "Проверка package name..."
          PKG_CHECK=$($AAPT dump badging "$UNIVERSAL_APK" | grep "package: name='io.github.kiryuhak.smarttubevot.stable'")
          if [ -z "$PKG_CHECK" ]; then
            echo "::error::Неверный package name в APK! Ожидался: io.github.kiryuhak.smarttubevot.stable"
            exit 1
          fi
          echo "Package name корректен: io.github.kiryuhak.smarttubevot.stable"

          # 2. Проверка versionName
          echo "Проверка versionName..."
          VER_CHECK=$($AAPT dump badging "$UNIVERSAL_APK" | grep "versionName='$VERSION_NAME'")
          if [ -z "$VER_CHECK" ]; then
            echo "::error::Неверный versionName в APK! Ожидался: $VERSION_NAME"
            exit 1
          fi
          echo "VersionName корректен: $VERSION_NAME"

          # 3. Проверка versionCode
          echo "Проверка versionCode..."
          CODE_CHECK=$($AAPT dump badging "$UNIVERSAL_APK" | grep "versionCode='$EXPECTED_CODE'")
          if [ -z "$CODE_CHECK" ]; then
            echo "::error::Неверный versionCode в APK! Ожидался: $EXPECTED_CODE"
            exit 1
          fi
          echo "VersionCode корректен: $EXPECTED_CODE"

          # 4. Проверка цифровой подписи release-ключом
          echo "Проверка цифровой подписи APK..."
          $APKSIGNER verify --verbose --print-certs "$UNIVERSAL_APK"
          if [ $? -ne 0 ]; then
            echo "::error::APK не подписан или цифровая подпись недействительна!"
            exit 1
          fi
          echo "Цифровая подпись успешно верифицирована."

          # Подготовка основных ассетов для release и updater (только SmartTube VOX)
          cp "$UNIVERSAL_APK" smarttube_vox.apk
          cp "$UNIVERSAL_APK" smarttube_vox-universal.apk
          echo "Созданы основные ассеты для release: smarttube_vox.apk, smarttube_vox-universal.apk"

          ARM64_APK=$(find "$OUTPUT_DIR" -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$ARM64_APK" ] && [ -f "$ARM64_APK" ]; then
            cp "$ARM64_APK" smarttube_vox-arm64-v8a.apk
            echo "Создан ассет: smarttube_vox-arm64-v8a.apk"
          fi

          ARMEABI_APK=$(find "$OUTPUT_DIR" -name "*armeabi-v7a*.apk" | head -n 1)
          if [ -n "$ARMEABI_APK" ] && [ -f "$ARMEABI_APK" ]; then
            cp "$ARMEABI_APK" smarttube_vox-armeabi-v7a.apk
            echo "Создан ассет: smarttube_vox-armeabi-v7a.apk"
          fi

          X86_APK=$(find "$OUTPUT_DIR" -name "*x86*.apk" | head -n 1)
          if [ -n "$X86_APK" ] && [ -f "$X86_APK" ]; then
            cp "$X86_APK" smarttube_vox-x86.apk
            echo "Создан ассет: smarttube_vox-x86.apk"
          fi

      - name: Extract Release Notes and Generate Update JSON
        env:
          VERSION_NAME: ${{ steps.tag_info.outputs.VERSION_NAME }}
          EXPECTED_CODE: ${{ steps.tag_info.outputs.EXPECTED_CODE }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import sys, re, json, os

          version = '${VERSION_NAME}'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              print(f'::error::Секция [{version}] не найдена в CHANGELOG.md!', file=sys.stderr)
              sys.exit(1)

          section = match.group(1).strip()
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(section)

          release_title = f'SmartTube VOX v{version}'
          try:
              header_line = re.search(rf'## \[{re.escape(version)}\]([^\n]*)', content)
              raw_suffix = header_line.group(1).strip() if header_line else ''
              codename_match = re.search(r'^[—\-–]\s*(.+)$', raw_suffix)
              codename = codename_match.group(1).strip() if codename_match else ''
              is_date = bool(re.match(r'^\d{4}-\d{2}-\d{2}$', codename))
              base_ver = version.split('-')[0]
              if codename and not is_date:
                  release_title = f'SmartTube VOX {base_ver} — {codename}'
              else:
                  release_title = f'SmartTube VOX v{version}'
          except Exception as e:
              print(f'::warning::Не удалось извлечь кодовое имя релиза ({e}), используется fallback', file=sys.stderr)
              release_title = f'SmartTube VOX v{version}'

          print(f'Сформирован заголовок релиза: {release_title}')

          env_file = os.getenv('GITHUB_ENV')
          if env_file:
              with open(env_file, 'a', encoding='utf-8') as ef:
                  ef.write(f'RELEASE_TITLE={release_title}\n')

          ru_items = [
              line.strip().lstrip('-*').strip()
              for line in section.splitlines()
              if line.strip().startswith(('-', '*'))
          ]

          # Основной манифест обновления SmartTube VOX
          json_vox = {
              'package': {
                  'downloadUrl': f'https://github.com/{sys.argv[1]}/releases/latest/download/smarttube_vox.apk'
              },
              version: {
                  'versionCode': int(sys.argv[2]),
                  'changelog': [
                      'Voice-over translation via Yandex VOT for Android TV',
                      'Yandex OAuth and Lively Voice support',
                      'Dedicated stvot flavor with isolated package ID',
                      'Adaptive TV launcher icon and banner',
                      'In-app updater support'
                  ],
                  'changelog_ru': ru_items
              }
          }
          with open('smarttube_vox.json', 'w', encoding='utf-8') as f:
              json.dump(json_vox, f, ensure_ascii=False, indent=2)

          print('smarttube_vox.json успешно сформирован и валидирован.')
          " "$REPO" "$EXPECTED_CODE"

          # Валидация сформированного JSON
          jq . smarttube_vox.json

          # Проверка корректности downloadUrl
          DL_VOX=$(jq -r '.package.downloadUrl' smarttube_vox.json)
          if [[ ! "$DL_VOX" =~ /smarttube_vox\.apk$ ]]; then
            echo "::error::downloadUrl в smarttube_vox.json ($DL_VOX) не указывает на smarttube_vox.apk!"
            exit 1
          fi

      - name: Publish Atomic GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_info.outputs.TAG }}
          VERSION_NAME: ${{ steps.tag_info.outputs.VERSION_NAME }}
        run: |
          echo "Публикация GitHub Release для тега $TAG..."
          gh release create "$TAG" \
            --title "${RELEASE_TITLE:-SmartTube VOX v$VERSION_NAME}" \
            --notes-file release_notes.md \
            smarttube_vox.apk \
            smarttube_vox-*.apk \
            smarttube_vox.json

          echo "Релиз успешно опубликован со всеми VOX ассетами и метаданными обновления."

      - name: Clean up runner secrets
        if: always()
        run: |
          rm -f keystore.properties /tmp/release.jks release_notes.md
          echo "Временные файлы подписи и заметок релиза удалены."
