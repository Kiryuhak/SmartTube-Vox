name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - 'feature/*'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check code formatting and whitespace
        run: git diff --check

      - name: Run unit tests
        run: ./gradlew :common:testStvotDebugUnitTest

      - name: Build stvot Debug APK
        run: ./gradlew assembleStvotDebug

      - name: Build ststable Debug APK
        run: ./gradlew assembleStstableDebug

      - name: Verify dependency isolation (no AuthSDK in ststable)
        run: |
          echo "Проверка изоляции: com.yandex.android:authsdk не должен входить в ststableDebugRuntimeClasspath"
          if ./gradlew :smarttubetv:dependencies --configuration ststableDebugRuntimeClasspath | grep -q "com.yandex.android:authsdk"; then
            echo "::error::Обнаружена утечка com.yandex.android:authsdk в конфигурацию ststable!"
            exit 1
          fi
          echo "Изоляция подтверждена: AuthSDK отсутствует в ststable."
