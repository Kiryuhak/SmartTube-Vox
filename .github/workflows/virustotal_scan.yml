name: VirusTotal Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to scan'
        required: true

jobs:
  virustotal_scan:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
      REPORT_MARKER: '<!-- SMARTTUBE_VOX_VIRUSTOTAL_REPORT -->'

    steps:
      - name: Set tag variable
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          fi

      - name: Report skipped when API key is unavailable
        if: ${{ env.HAS_VT_KEY != 'true' }}
        run: |
          echo "::notice::VIRUS_TOTAL_API_KEY отсутствует: сканирование, отчёт и изменение Release notes пропущены."

      - name: Download Release Assets
        if: ${{ env.HAS_VT_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          gh release download "$TAG_NAME" --dir release_assets --pattern "*.apk"
          compgen -G 'release_assets/*.apk' >/dev/null || {
            echo "::error::APK assets для $TAG_NAME не найдены."
            exit 1
          }

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            release_assets/*.apk
          request_rate: 4

      - name: Generate Custom Badge Report
        if: steps.vt.outcome == 'success'
        id: report
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          printf '%s\n## 🛡️ VirusTotal Analysis\n' "$REPORT_MARKER" > vt_report.txt
          echo "" >> vt_report.txt

          echo "| Build Variant | VirusTotal Status | Detailed Report |" >> vt_report.txt
          echo "| :--- | :--- | :--- |" >> vt_report.txt
          
          for file in release_assets/*.apk; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')

            vt_link="https://www.virustotal.com/gui/file/$sha256/detection"
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"

            echo "Purging badge cache for $filename..."
            curl --fail --silent --show-error -X POST "$badge_url"
            
            asset_link="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/$filename"
            
            echo "| [$filename]($asset_link) | [![]($badge_url&v=$(date +%s))]($vt_link) | [View Report]($vt_link) |" >> vt_report.txt
          done

          test -s vt_report.txt
          grep -Fq "$REPORT_MARKER" vt_report.txt

      - name: Update Release Notes
        if: steps.vt.outcome == 'success' && steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s vt_report.txt
          gh release view "$TAG_NAME" --json body -q .body > current_notes.txt

          python3 - <<'PY'
          import os
          from pathlib import Path

          marker = os.environ['REPORT_MARKER']
          current = Path('current_notes.txt').read_text(encoding='utf-8')
          report = Path('vt_report.txt').read_text(encoding='utf-8')
          if marker not in report:
              raise SystemExit('VirusTotal report marker is missing')
          manual = current.split(marker, 1)[0].rstrip()
          Path('final_notes.txt').write_text(
              f'{manual}\n\n{report.lstrip()}',
              encoding='utf-8',
          )
          PY
          
          gh release edit "$TAG_NAME" --notes-file final_notes.txt
